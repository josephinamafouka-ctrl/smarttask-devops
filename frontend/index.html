<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>SmartTask Manager</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 50px; background: #f4f4f9; }
        .container { max-width: 500px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); }
        input { padding: 8px; width: 70%; }
        button { padding: 8px 15px; background: #007bff; color: white; border: none; cursor: pointer; }
        ul { padding-left: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>SmartTask - Gestion des Tâches</h2>
        <input type="text" id="taskInput" placeholder="Nouvelle tâche...">
        <button onclick="addTask()">Ajouter</button>
        <ul id="taskList"></ul>
    </div>

    <script>
        const API_URL = "http://localhost:8000";

        async function fetchTasks() {
            try {
                const res = await fetch(`${API_URL}/tasks`);
                const tasks = await res.json();
                const list = document.getElementById('taskList');
                list.innerHTML = '';
                tasks.forEach(t => {
                    const li = document.createElement('li');
                    li.textContent = t.title;
                    list.appendChild(li);
                });
            } catch (err) {
                console.error("Erreur de chargement des tâches", err);
            }
        }

        async function addTask() {
            const input = document.getElementById('taskInput');
            if (!input.value) return;
            await fetch(`${API_URL}/tasks`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title: input.value })
            });
            input.value = '';
            fetchTasks();
        }

        fetchTasks();
    </script>
</body>
</html>
